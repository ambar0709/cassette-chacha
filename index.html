      <li><a href="https://deluxedhaba.netlify.app/">Deluxe Dhaba (deluxedhaba.netlify.app)</a> — a cinematic dhaba music player with Rainy and Night modes.</li>
      <li><a href="https://chaiwala.live/">Chai Wala (chaiwala.live)</a> — a warm chai-stall playlist; steam, stillness and chai.</li>
      <li><a href="https://mehfil.wtf/">Mehfil (mehfil.wtf)</a> — a qawwali and ghazal courtyard player.</li>
    </ul>
  </section>
</noscript>

<footer>
  <a id="footAdd" href="#" target="_blank" rel="noopener">➕ Suggest a cassette</a> ·
  <a id="footIssue" href="#" target="_blank" rel="noopener">🐛 Issue / feature request</a>
</footer>

<!-- Stage -->
<div class="stage" id="stage" role="dialog" aria-modal="true" aria-label="Music player">
  <div class="stage-bar">
    <img class="stage-logo" src="assets/cassette-chacha-wordmark.svg" width="820" height="140" alt="Cassette Chacha" />
    <div class="vinyl" aria-hidden="true"></div>
    <div class="now">
      <span class="eq" id="stageEq" aria-hidden="true"><i style="height:40%"></i><i style="height:100%"></i><i style="height:65%"></i><i style="height:90%"></i><i style="height:50%"></i></span>
      <span class="s-title" id="sTitle"></span>
      <span class="s-host" id="sHost"></span>
    </div>
    <span class="hint-pill" id="sHint"></span>
    <span class="spacer"></span>
    <button class="s-btn" id="sSurprise" title="Jump to a random station">🎲</button>
    <button class="s-btn" id="sShare" title="Copy this station's link">🔗 Share</button>
    <a class="s-btn" id="sOpen" target="_blank" rel="noopener">Open ↗</a>
    <button class="s-btn close" id="sClose">✕ Close</button>
  </div>
  <div class="frame-wrap">
    <div class="frame-loader" id="sLoader"><div><div class="spin-l"></div>tuning in…</div></div>
    <iframe id="sFrame" title="Embedded music player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
      allowfullscreen></iframe>
  </div>
  <div class="dock" id="dock"></div>
</div>

<script>
  const SITES = [
    { id:"saloon", title:"Deluxe Saloon", host:"saloon.wtf", url:"https://saloon.wtf/", img:"assets/saloon.webp",
      tags:["90s Bollywood","Barber-shop","Non-stop"], hint:"👆 tap to start the shave-shop playlist",
      theme:["#5f160c","#b3202a","#f0b429"], accent:"#f5b544", fx:"petal", kit:"tv" },
    { id:"raju", title:"Raju Mistri Ki Playlist", host:"rajumistri.online", url:"https://rajumistri.online/", img:"assets/raju.webp",
      tags:["90s Hindi","Live listeners","Chai-break"], hint:"🔊 starts muted — tap play once to unmute",
      theme:["#5a0a0e","#d81f2a","#ff5a4d"], accent:"#ff6a5a", fx:"note", kit:"tv" },
    { id:"horn", title:"Horn OK Please", host:"hornokplease.wtf", url:"https://hornokplease.wtf/", img:"assets/horn.webp",
      tags:["Road trip","Truck art","Shuffle"], hint:"👆 tap Start Engine, then Press The Horn",
      theme:["#6e3206","#ff7a1a","#f5b544"], accent:"#ff9a3c", fx:"dust", kit:"windshield" },
    { id:"busdriver", title:"Bus Driver", host:"busdriver.wtf", url:"https://busdriver.wtf/", img:"assets/busdriver.webp",
      tags:["80s & 90s","Night service","Highway"], hint:"👆 press play — tapes from the highway",
      theme:["#5a2e0c","#c56a1e","#f0a94a"], accent:"#f0a94a", fx:"dust", kit:"windshield" },
    { id:"dhaba", title:"Deluxe Dhaba", host:"deluxedhaba.netlify.app", url:"https://deluxedhaba.netlify.app/", img:"assets/dhaba.webp",
      tags:["Cinematic","Rainy / Night","Custom player"], hint:"👆 select a track, then hit play",
      theme:["#5c1a13","#c0392b","#3d7a4a"], accent:"#e0533f", fx:"rain", kit:"tv" },
    { id:"chaiwala", title:"Chai Wala", host:"chaiwala.live", url:"https://chaiwala.live/", img:"assets/chaiwala.webp",
      tags:["Chai stall","Ambient","Playlist"], hint:"🍵 tap play to pour the chai",
      theme:["#3f2c12","#8a5a2c","#c99a5c"], accent:"#d0a15c", fx:"steam", kit:"tv" },
    { id:"mehfil", title:"Mehfil", host:"mehfil.wtf", url:"https://mehfil.wtf/", img:"assets/mehfil.webp",
      tags:["Qawwali","Ghazal","Courtyard"], hint:"👆 press play for the qawwali mehfil",
      theme:["#5a1418","#a8324a","#d98a4a"], accent:"#e0a24a", fx:"note", kit:"arch" },
  ];

  const $ = s => document.querySelector(s);
  const grid=$("#grid"), stage=$("#stage"), dock=$("#dock");
  const sFrame=$("#sFrame"), sTitle=$("#sTitle"), sHost=$("#sHost"), sOpen=$("#sOpen"), sHint=$("#sHint"), sLoader=$("#sLoader");
  const resumeBtn=$("#resume");
  const stageEqBars=[...document.querySelectorAll("#stageEq i")];
  let current=null, stageOpen=false, reeling=false;

  // ---------- share + submit (GitHub) ----------
  // 👉 Set this to your repo ("owner/repo") to enable the Suggest / Issue links:
  const REPO = "ambar0709/cassette-chacha";
  const repoSet = !REPO.includes("OWNER");
  const ghIssue=(title,body,labels)=>`https://github.com/${REPO}/issues/new?labels=${encodeURIComponent(labels)}&title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  const addUrl=ghIssue("New cassette: <name>","**Cassette URL:**\n**Name:**\n**Vibe / why it belongs here:**\n","new-cassette");
  const issueUrl=ghIssue("Feature request / bug: ","**What would you like?**\n\n**Details / steps:**\n","enhancement");
  [["footAdd",addUrl],["footIssue",issueUrl]].forEach(([id,url])=>{
    const el=document.getElementById(id); if(!el) return;
    el.href=repoSet?url:"#";
    if(!repoSet) el.addEventListener("click",e=>{e.preventDefault();toast('Set your GitHub repo in the code — REPO = "owner/repo"');});
  });
  let toastT;
  function toast(msg){
    let t=document.getElementById("toast");
    if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}
    t.textContent=msg;t.classList.add("show");
    clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2400);
  }
  $("#sShare").addEventListener("click",async()=>{
    const url=location.href;                              // real browser URL, includes #station
    try{await navigator.clipboard.writeText(url);toast("🔗 Copied: "+url.replace(/^https?:\/\//,""));}
    catch(e){toast("Copy this link: "+url);}
  });

  // ---------- storage ----------
  const FAVKEY="dj_favs", LASTKEY="dj_last";
  let favs=new Set(JSON.parse(localStorage.getItem(FAVKEY)||"[]"));
  const saveFavs=()=>localStorage.setItem(FAVKEY,JSON.stringify([...favs]));

  // ---------- gallery ----------
  grid.innerHTML = SITES.map((s,i)=>`
    <article class="card" data-id="${s.id}" style="animation-delay:${i*80}ms;--card-accent:${s.accent}">
      <div class="img" style="background-image:url('${s.img}')"></div>
      <div class="shine"></div>
      <button class="fav" data-fav="${s.id}" aria-label="Favourite">${favs.has(s.id)?"★":"☆"}</button>
      <div class="play-badge">▶</div>
      <div class="meta"><h2>${s.title}</h2><div class="host">${s.host}</div>
        <div class="tags">${s.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div></div>
    </article>`).join("");

  dock.innerHTML = SITES.map(s=>`
    <div class="dock-item" data-id="${s.id}" title="${s.title}">
      <div class="di-img" style="background-image:url('${s.img}')"></div>
      <span class="di-star">★</span>
      <span class="di-eq"><i style="height:40%"></i><i style="height:100%"></i><i style="height:60%"></i><i style="height:85%"></i></span>
      <span class="di-name">${s.title}</span>
    </div>`).join("");

  function renderFavState(){
    document.querySelectorAll(".fav").forEach(b=>{const on=favs.has(b.dataset.fav);b.classList.toggle("on",on);b.textContent=on?"★":"☆";});
    document.querySelectorAll(".dock-item").forEach(d=>d.classList.toggle("faved",favs.has(d.dataset.id)));
  }
  renderFavState();

  // ---------- theme ----------
  function setTheme(s){const r=document.documentElement.style;r.setProperty("--a1",s.theme[0]);r.setProperty("--a2",s.theme[1]);r.setProperty("--a3",s.theme[2]);r.setProperty("--accent",s.accent);}

  // ---------- play ----------
  function tune(id){
    const s=SITES.find(x=>x.id===id); if(!s) return;
    current=id; setTheme(s);
    sTitle.textContent=s.title; sHost.textContent=s.host; sOpen.href=s.url; sHint.textContent=s.hint;
    sLoader.classList.remove("hide");
    sFrame.src="about:blank"; setTimeout(()=>{sFrame.src=s.url;},60);
    stage.classList.add("playing");
    dock.querySelectorAll(".dock-item").forEach(d=>d.classList.toggle("active",d.dataset.id===id));
    const a=dock.querySelector(".dock-item.active"); if(a) a.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
    localStorage.setItem(LASTKEY,id);
    history.replaceState(null,"","#"+id);
    burst(s);            // petal/diya burst on tune
    setEmitter(s.fx);
  }
  sFrame.addEventListener("load",()=>{if(sFrame.src&&sFrame.src!=="about:blank")sLoader.classList.add("hide");});

  function openStageShell(){stage.classList.add("open");document.body.style.overflow="hidden";stageOpen=true;}
  function openStage(id){openStageShell();tune(id);}
  function closeStage(){
    stage.classList.remove("open","playing");sFrame.src="about:blank";document.body.style.overflow="";
    stageOpen=false;current=null;setEmitter(null);history.replaceState(null,"","#");setTheme(SITES[0]);updateResume();
  }

  // ---------- surprise (slot-machine reel) ----------
  function surprise(){
    if(reeling) return; reeling=true;
    const pool=SITES.filter(s=>s.id!==current); const target=pool[Math.floor(Math.random()*pool.length)]||SITES[0];
    if(!stageOpen) openStageShell();
    sTitle.textContent="🎲 spinning…"; sHint.textContent=""; sLoader.classList.remove("hide");
    let i=0, delay=55; const steps=16;
    (function step(){
      const s=SITES[i%SITES.length];
      setTheme(s);
      dock.querySelectorAll(".dock-item").forEach(d=>d.classList.toggle("active",d.dataset.id===s.id));
      i++; delay*=1.14;
      if(i<steps) setTimeout(step,delay);
      else { reeling=false; tune(target.id); }
    })();
  }

  // ---------- resume pill ----------
  function updateResume(){
    const last=localStorage.getItem(LASTKEY); const s=SITES.find(x=>x.id===last);
    if(s && !stageOpen){
      resumeBtn.style.display="inline-flex";
      resumeBtn.setAttribute("aria-label",`Resume ${s.title}`);
      resumeBtn.innerHTML=`<span aria-hidden="true">▶</span><span class="resume-label">Resume <b>${s.title}</b></span>`;
      resumeBtn.onclick=()=>openStage(s.id);
    }
    else resumeBtn.style.display="none";
  }

  // ---------- events ----------
  grid.addEventListener("click",e=>{
    const fav=e.target.closest(".fav");
    if(fav){e.stopPropagation();const id=fav.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);saveFavs();renderFavState();return;}
    const c=e.target.closest(".card"); if(c) openStage(c.dataset.id);
  });
  dock.addEventListener("click",e=>{const d=e.target.closest(".dock-item");if(d&&d.dataset.id!==current)tune(d.dataset.id);});
  $("#sClose").addEventListener("click",closeStage);
  $("#surprise").addEventListener("click",surprise);
  $("#sSurprise").addEventListener("click",surprise);
  document.addEventListener("keydown",e=>{
    if(e.key.toLowerCase()==="s"&&!stageOpen){surprise();return;}
    if(!stageOpen) return;
    if(e.key==="Escape") closeStage();
    if(e.key==="ArrowRight"||e.key==="ArrowLeft"){const i=SITES.findIndex(x=>x.id===current);const n=(i+(e.key==="ArrowRight"?1:-1)+SITES.length)%SITES.length;tune(SITES[n].id);}
  });

  // deep-link
  window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(SITES.some(s=>s.id===h)){stageOpen?(h!==current&&tune(h)):openStage(h);}else if(!location.hash&&stageOpen)closeStage();});

  // 3D tilt
  grid.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("mousemove",e=>{const r=card.getBoundingClientRect();const px=(e.clientX-r.left)/r.width-.5;const py=(e.clientY-r.top)/r.height-.5;card.style.transform=`perspective(900px) rotateY(${px*8}deg) rotateX(${-py*8}deg) translateY(-4px)`;});
    card.addEventListener("mouseleave",()=>{card.style.transform="";});
  });

  // ---------- particles ----------
  const fx=$("#fx"),ctx=fx.getContext("2d");let W,H,DPR=Math.min(2,devicePixelRatio||1);
  function resize(){W=innerWidth;H=innerHeight;fx.width=W*DPR;fx.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
  resize();addEventListener("resize",resize);
  let parts=[],emitType=null,acc=0;
  function setEmitter(t){emitType=t;}
  function accent(){const s=SITES.find(x=>x.id===current);return s?s.accent:"#f5b544";}
  function mk(type,x,y,burstV){
    const c=accent();
    if(type==="petal")return{t:"petal",x,y:y??-10,vx:(Math.random()-.5)*.8,vy:.6+Math.random()*1.2,s:6+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.12,a:1,life:0,max:520,col:Math.random()<.5?c:"#ffd85a"};
    if(type==="note")return{t:"note",x,y:y??H+10,vx:(Math.random()-.5)*1,vy:-(.6+Math.random()*1),s:14+Math.random()*10,a:1,life:0,max:360,col:c,ch:Math.random()<.5?"♪":"♫"};
    if(type==="dust")return{t:"dust",x:x??Math.random()*W,y:y??Math.random()*H,vx:(Math.random()-.5)*.4,vy:-(.1+Math.random()*.3),s:1.5+Math.random()*2.5,a:.5,life:0,max:600,col:c};
    if(type==="rain")return{t:"rain",x:x??Math.random()*W,y:y??-10,vx:-1,vy:7+Math.random()*5,s:9+Math.random()*8,a:.6,life:0,max:200,col:"#bcd6ff"};
    if(type==="steam")return{t:"steam",x,y:y??H*.6+Math.random()*H*.3,vx:(Math.random()-.5)*.3,vy:-(.5+Math.random()*.8),s:8+Math.random()*10,a:.5,life:0,max:260,col:"#f0ead8"};
    if(type==="diya")return{t:"petal",x,y,vx:Math.cos(burstV.a)*burstV.sp,vy:Math.sin(burstV.a)*burstV.sp-1,s:4+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.2,a:1,life:0,max:110,col:Math.random()<.5?c:"#ffd85a"};
  }
  function burst(s){const cx=W/2,cy=H*.42;for(let i=0;i<24;i++){const a=Math.random()*Math.PI*2,sp=2+Math.random()*5;parts.push(mk("diya",cx,cy,{a,sp}));}}
  function loop(){
    requestAnimationFrame(loop);
    ctx.clearRect(0,0,W,H);
    /* continuous ambient particles removed — burst-only for a clean look */
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];p.life++;p.x+=p.vx;p.y+=p.vy;
      if(p.t==="petal"){p.vy+=.006;p.rot+=p.vr;p.vx+=Math.sin(p.life*.05)*.02;}
      if(p.t==="note"){p.vx+=Math.sin(p.life*.06)*.03;p.a=1-p.life/p.max;}
      if(p.t==="dust"){p.a=.5*(1-p.life/p.max);}
      if(p.t==="steam"){p.s+=.12;p.a=.5*(1-p.life/p.max);}
      if(p.t==="rain"){p.a=.6;}
      const off=p.y>H+40||p.y<-60||p.x<-60||p.x>W+60||p.life>p.max||p.a<=0;
      if(off){parts.splice(i,1);continue;}
      ctx.globalAlpha=Math.max(0,p.a);
      if(p.t==="petal"){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.55,0,0,7);ctx.fill();ctx.restore();}
      else if(p.t==="note"){ctx.fillStyle=p.col;ctx.font=`${p.s}px system-ui`;ctx.fillText(p.ch,p.x,p.y);}
      else if(p.t==="rain"){ctx.strokeStyle=p.col;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2,p.y-p.s);ctx.stroke();}
      else{ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();}
    }
    ctx.globalAlpha=1;
    if(parts.length>200)parts.splice(0,parts.length-200);
  }
  loop();

  // ---------- boot ----------
  setTheme(SITES[0]); updateResume();
  const h=location.hash.slice(1); if(SITES.some(s=>s.id===h)) openStage(h);
</script>
